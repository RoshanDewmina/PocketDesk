<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PocketDesk OS-input latency target</title><style>html,body{margin:0;height:100%;background:#050505}</style></head><body><script>
const DARK = '#050505', LIGHT = '#f5f5f5';
let bright = false;
addEventListener('keydown', (event) => {
  if (event.repeat || event.code !== 'Space') return;
  bright = !bright;
  document.body.style.backgroundColor = bright ? LIGHT : DARK;
  event.preventDefault();
});
</script></body></html>
