<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#050505">
<title>Farside hero lab</title>
<script>(function(){var p=new URLSearchParams(location.search),v=(p.get('v')||'a2').toLowerCase();if(!/^(a|a2|b|c)$/.test(v))v='a2';var d=document.documentElement;d.dataset.v=v;if(p.get('chrome')==='0')d.dataset.chrome='off'})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&text=farside&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 38'%3E%3Crect width='26' height='38' rx='5' fill='%23050505'/%3E%3Ccircle cx='5' cy='6' r='3.6' fill='%23FF5B1F'/%3E%3Cpath d='M5 12v18l5-5 3 7 3-1-3-7h7z' fill='%23EDE8DF'/%3E%3C/svg%3E">
<style>
:root{
  --void:#050505;--void2:#0B0B0B;--panel:#121212;--panel2:#191919;
  --bone:#EDE8DF;--ash:#8C877F;--dim:#4A4742;--line:rgba(237,232,223,.12);--line2:rgba(237,232,223,.22);
  --ember:#FF5B1F;--ember-d:#C23D0E;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --lab:44px;
}
*{box-sizing:border-box}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--bone);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- lab chrome (not part of the design) ---------- */
.lab{position:sticky;top:0;z-index:50;height:var(--lab);display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left));background:#E4E4E2;color:#111;font:500 13px/1 -apple-system,system-ui,sans-serif;border-bottom:1px dashed #8a8a8a}
[data-chrome=off] .lab,[data-chrome=off] .lab-d{display:none}
.lab-t{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.lab-seg{display:flex;background:#cfcfcc;border-radius:8px;padding:2px}
.lab-seg a{display:grid;place-items:center;min-width:40px;height:34px;padding:0 10px;border-radius:6px;color:#333;text-decoration:none;font-weight:600;white-space:nowrap}
.lab-seg a[aria-current=page]{background:#111;color:#fff}
.lab-seg a span{font-weight:500}
.lab-note{color:#555;white-space:nowrap;display:none}
[data-v=b] .lab-note{display:inline}
.lab-w{margin-left:auto;height:34px;padding:0 10px;border:1px solid #9a9a9a;border-radius:8px;background:#f4f4f2;color:#111;font:600 12.5px/1 ui-monospace,Menlo,monospace;white-space:nowrap;cursor:pointer}
.lab-w i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-right:6px;vertical-align:0}
.lab-w.ok i{background:#1a8f3c}.lab-w.over i{background:#d0241a}
.lab-d{position:fixed;z-index:49;top:var(--lab);right:8px;left:8px;max-width:520px;margin-left:auto;background:#f4f4f2;color:#111;border:1px solid #9a9a9a;border-radius:10px;padding:12px 14px;font:12.5px/1.5 ui-monospace,Menlo,monospace;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:70vh;overflow:auto}
.lab-d table{width:100%;border-collapse:collapse}
.lab-d td{padding:2px 0;vertical-align:top}.lab-d td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.lab-d td:first-child{word-break:break-all}
.lab-d p{margin:0 0 8px;font-family:-apple-system,system-ui,sans-serif;font-size:13px}
.lab-d h4{margin:10px 0 4px;font:700 12px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.lab-t{display:none}.lab-seg a span{display:none}.lab-long{display:none}}

/* ---------- hero (shared by all versions) ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:calc(100vh - var(--lab));min-height:calc(100svh - var(--lab));display:flex;flex-direction:column;padding:0 16px max(16px,env(safe-area-inset-bottom))}
[data-chrome=off] .hero{min-height:100vh;min-height:100svh}
.top{position:relative;z-index:2;height:60px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:9px;color:var(--bone);text-decoration:none}
.brand svg{width:15px;height:22px}
.wm{display:inline-block;width:108px;font:800 25px/1 "Doto",var(--mono);letter-spacing:.01em;white-space:nowrap}
.copy{position:relative;z-index:2;padding-top:6px}
h1{margin:0;font:700 clamp(34px,10.2vw,46px)/1.04 var(--ui);letter-spacing:-.028em;text-wrap:balance;max-width:14ch}
.sub{margin:14px 0 0;font-size:17px;line-height:1.42;color:rgba(237,232,223,.72);max-width:30ch;text-wrap:pretty}
.join{display:flex;align-items:stretch;gap:6px;margin-top:22px;max-width:440px;height:56px;padding:4px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2)}
.join:focus-within{box-shadow:inset 0 0 0 1px rgba(237,232,223,.5)}
.join input{flex:1;min-width:0;border:0;background:none;color:var(--bone);font:16px var(--ui);padding:0 12px;outline:none}
.join input::placeholder{color:#7d786f}
.join button{flex:none;border:0;border-radius:10px;padding:0 18px;background:var(--bone);color:#0A0A0A;font:600 16px var(--ui);cursor:pointer;transition:transform .14s var(--ease)}
.join button:active{transform:scale(.97)}
.join button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.note{min-height:24px;margin:10px 0 0;font-size:15px;color:rgba(237,232,223,.8)}
.stage{position:relative;z-index:1;flex:1;display:flex;align-items:flex-start;justify-content:center;padding:30px 0 8px;min-height:300px}

@media (min-width:960px){
  .hero{display:grid;grid-template-columns:minmax(520px,5fr) minmax(0,6fr);grid-template-rows:76px 1fr;column-gap:clamp(24px,4vw,64px);padding:0 clamp(32px,5vw,88px) 32px}
  .top{grid-column:1/-1;height:76px}
  .copy{grid-row:2;align-self:center;padding:0 0 72px}
  h1{font-size:clamp(48px,4.2vw,64px);max-width:none}
  .sub{font-size:20px;margin-top:18px}
  .join{margin-top:30px}
  .stage{grid-row:2;grid-column:2;align-self:center;align-items:center;padding:0 0 56px}
}

/* ---------- device frames (A and B) ---------- */
.devs{--mac-l:1;--mac-w:98;--ph-l:15;--ph-w:84;--ph-t:62;--h:102;position:relative;width:100%;max-width:560px;container-type:inline-size}
.devs::before{content:"";display:block;padding-top:calc(var(--h)*1%)}
@media (min-width:960px){.devs{--mac-l:0;--mac-w:90;--ph-l:50;--ph-w:50;--ph-t:50.5;--h:76;max-width:780px}}
.mac{position:absolute;left:calc(var(--mac-l)*1cqw);top:0;width:calc(var(--mac-w)*1cqw);container-type:inline-size}
.mac-lid{margin:0 4.5cqw;padding:2.2cqw 2.2cqw 3cqw;background:#0c0c0c;border-radius:3cqw 3cqw .9cqw .9cqw;box-shadow:inset 0 0 0 1px #37342f,inset 0 0 0 .45cqw #050505,0 30px 60px -20px rgba(0,0,0,.8)}
.mac-scr{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:.5cqw;background:#000;container-type:inline-size}
.mac-base{position:relative;height:2.5cqw;background:linear-gradient(#45423e,#1f1e1c 55%,#0d0d0c);border-radius:0 0 3cqw 3cqw/0 0 2.2cqw 2.2cqw;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.mac-base::before{content:"";position:absolute;left:43%;width:14%;top:0;height:42%;background:#141312;border-radius:0 0 1.2cqw 1.2cqw}
.phone{position:absolute;left:calc(var(--ph-l)*1cqw);top:calc(var(--ph-t)*1cqw);width:calc(var(--ph-w)*1cqw);container-type:inline-size;padding:1.9cqw;border-radius:9.5cqw;background:linear-gradient(150deg,#34312d,#0f0e0d 38%,#1c1b19);box-shadow:inset 0 0 0 1.5px #3d3a36,0 0 0 1px #000,0 26px 60px rgba(0,0,0,.75),0 8px 18px rgba(0,0,0,.5)}
.ph-scr{position:relative;aspect-ratio:2622/1206;border-radius:7.6cqw;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.ph-isl{position:absolute;z-index:6;left:1.3%;top:34%;width:4.3%;height:32%;border-radius:99px;background:#000;box-shadow:0 0 0 .2cqw #0b0b0b}
.ph-desk{position:absolute;left:15%;top:0;width:70%;aspect-ratio:16/10;container-type:inline-size}
.ph-handle{position:absolute;z-index:5;left:50%;bottom:.9%;width:8.4%;height:3.9%;transform:translateX(-50%);border-radius:99px;background:#0b0b0b;box-shadow:inset 0 0 0 1px rgba(237,232,223,.28);display:flex;align-items:center;justify-content:space-evenly;padding:0 .9%}
.ph-handle i{width:.62cqw;height:.62cqw;border-radius:50%;background:var(--bone)}
.ptr{position:absolute;left:0;top:0;z-index:8;width:2.3cqw;pointer-events:none;will-change:transform}
.ptr svg{width:100%;height:auto;transform:translate(-8.8%,-6.5%);filter:drop-shadow(0 .15cqw .3cqw rgba(0,0,0,.35))}
.ph-scr>.ptr{width:3.9cqw}
.ghost{position:absolute;left:0;top:0;z-index:9;width:7.4cqw;height:7.4cqw;margin:-3.7cqw 0 0 -3.7cqw;opacity:0;pointer-events:none;will-change:transform,opacity}
.ghost i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(237,232,223,.42),rgba(237,232,223,.18) 62%,rgba(237,232,223,.08));box-shadow:0 0 0 1.5px rgba(237,232,223,.6),0 .8cqw 2cqw rgba(0,0,0,.5);transition:transform .12s var(--ease),background .12s}
.ghost.down i{transform:scale(.84);background:radial-gradient(circle at 50% 42%,rgba(237,232,223,.62),rgba(237,232,223,.3) 62%,rgba(237,232,223,.12))}
.rip{position:absolute;left:0;top:0;z-index:7;width:7cqw;height:7cqw;margin:-3.5cqw 0 0 -3.5cqw;border-radius:50%;border:.4cqw solid var(--ember);opacity:0;pointer-events:none}
.rip::after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:var(--ember);box-shadow:0 0 1.4cqw var(--ember)}
.ph-scr>.rip{width:10cqw;height:10cqw;margin:-5cqw 0 0 -5cqw}
.try{position:absolute;z-index:10;right:3%;bottom:6%;padding:.5em .8em;border-radius:8px;background:rgba(5,5,5,.82);box-shadow:inset 0 0 0 1px var(--line2);font:600 max(12px,3.2cqw)/1 var(--ui);color:var(--bone);pointer-events:none}

/* ---------- A: drawn Mac scene ---------- */
.scene{position:absolute;inset:0;overflow:hidden;background:#0A0A0A;color:var(--bone);font-family:var(--ui);line-height:1.3}
.sc-wall{position:absolute;inset:0;background:radial-gradient(circle,rgba(237,232,223,.55) 0 .24cqw,transparent .34cqw) 0 0/1.7cqw 1.7cqw;-webkit-mask:radial-gradient(circle at 84% 122%,#000 0 30%,rgba(0,0,0,.45) 44%,transparent 63%);mask:radial-gradient(circle at 84% 122%,#000 0 30%,rgba(0,0,0,.45) 44%,transparent 63%)}
.sc-menu{position:absolute;left:0;right:0;top:0;height:3.6cqw;display:flex;align-items:center;gap:2.3cqw;padding:0 2.2cqw;background:rgba(22,22,22,.94);font-size:1.6cqw;color:rgba(237,232,223,.86)}
.sc-menu b{font-weight:650}
.sc-menu .r{margin-left:auto;display:flex;align-items:center;gap:1.8cqw}
.sc-menu .r svg{width:1.45cqw;height:2.2cqw}
.win{position:absolute;border-radius:1.2cqw;background:#141414;box-shadow:0 0 0 1px rgba(237,232,223,.15),0 2cqw 5cqw rgba(0,0,0,.65);overflow:hidden;transition:transform .34s var(--ease),opacity .34s var(--ease)}
.win .tb{height:3.8cqw;display:flex;align-items:center;gap:.8cqw;padding:0 1.5cqw;background:#1c1c1c;border-bottom:1px solid rgba(237,232,223,.08);font-size:1.5cqw;color:var(--ash)}
.win .tb i{width:1.25cqw;height:1.25cqw;border-radius:50%;background:#3b3935;flex:none}
.win .tb span{flex:1;text-align:center;margin-right:5.6cqw;white-space:nowrap}
.scene[data-focus=notes] .w-notes .tb i,.scene[data-focus=term] .w-term .tb i{background:#6b675f}
.scene[data-focus=term] .w-term .tb i[data-t=close]{background:var(--bone)}
.w-notes{left:5%;top:11%;width:39%;height:57%;z-index:2}
.scene[data-focus=notes] .w-notes{z-index:4}
.w-notes .bd{padding:2.4cqw 2.6cqw}
.w-notes h5{margin:0 0 1.4cqw;font:700 2.7cqw/1.1 var(--ui);letter-spacing:-.01em}
.ck{display:flex;align-items:center;gap:1.3cqw;margin-top:1.5cqw;font-size:1.95cqw;white-space:nowrap}
.ck i{flex:none;width:2cqw;height:2cqw;border-radius:.45cqw;box-shadow:inset 0 0 0 .18cqw rgba(237,232,223,.45);display:grid;place-items:center}
.ck.on i{background:var(--bone);box-shadow:none}
.ck.on i::after{content:"";width:.95cqw;height:.5cqw;border:solid #0A0A0A;border-width:0 0 .26cqw .26cqw;transform:translateY(-15%) rotate(-45deg)}
.ck.on span{color:var(--ash);text-decoration:line-through}
.w-term{left:36%;top:25%;width:59%;height:50%;z-index:3;background:#0B0B0B;transform-origin:52% 150%;transform:scale(.3) translateY(40%);opacity:0}
.scene.term-open .w-term{transform:none;opacity:1}
.w-term pre{margin:0;padding:1.9cqw 2.1cqw;font:1.95cqw/1.6 var(--mono);color:var(--bone);white-space:pre}
.tl{display:none}.tl.on{display:block}
.tl .pr,.tl.out{color:var(--ash)}
.tl .ok{color:var(--bone)}
.cr{display:inline-block;width:1.05cqw;height:2.2cqw;margin-left:.15cqw;background:var(--bone);vertical-align:-.4cqw;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sc-dock{position:absolute;left:50%;bottom:1.7cqw;transform:translateX(-50%);display:flex;gap:1.05cqw;padding:.95cqw;border-radius:1.9cqw;background:rgba(30,30,30,.9);box-shadow:0 0 0 1px rgba(237,232,223,.1)}
.sc-dock>i{position:relative;width:5.5cqw;height:5.5cqw;border-radius:1.35cqw;background:#1f1f1f;box-shadow:inset 0 0 0 1px rgba(237,232,223,.12);display:grid;place-items:center;color:rgba(237,232,223,.9);font:700 1.9cqw/1 var(--mono);font-style:normal}
.sc-dock>i svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sc-dock .d-term{background:#050505}
.scene.term-open .d-term::after{content:"";position:absolute;left:50%;bottom:-.75cqw;width:.55cqw;height:.55cqw;margin-left:-.275cqw;border-radius:50%;background:var(--bone)}

/* ---------- B: real app screenshots ---------- */
.bscene{position:absolute;inset:0;overflow:hidden;background:#000}
.bscene img{display:block;width:100%;height:100%}
.b-desk{position:absolute;inset:0}
.b-win{position:absolute;left:21.033%;top:22.009%;width:57.934%;height:55.915%;border-radius:.99cqw;overflow:hidden;box-shadow:0 1.1cqw 3.4cqw rgba(24,12,44,.38),0 0 0 .05cqw rgba(0,0,0,.18);will-change:transform}
.b-title{position:absolute;left:0;right:0;top:0;height:8.75%;display:flex;align-items:center;justify-content:center;font:600 1.12cqw/1 var(--ui);color:#1d1d1f;letter-spacing:-.005em}
.b-mk{position:absolute;left:83.7%;top:.62%;height:2.55%;width:auto}
.ph-cam{position:absolute;left:15%;top:0;width:70%;aspect-ratio:16/10;container-type:inline-size;will-change:transform}
.contact{position:absolute;left:0;top:0;z-index:7;width:2.6cqw;height:2.6cqw;margin:-1.3cqw 0 0 -1.3cqw;border-radius:50%;background:var(--ember);box-shadow:0 0 0 .7cqw rgba(255,91,31,.28),0 0 2.2cqw rgba(255,91,31,.8);opacity:0;pointer-events:none;will-change:transform,opacity}
.halo{position:absolute;left:0;top:0;z-index:6;width:14cqw;height:14cqw;margin:-7cqw 0 0 -7cqw;border-radius:50%;background:radial-gradient(circle,rgba(40,40,40,.55) 0 .34cqw,transparent .44cqw) 0 0/1.25cqw 1.25cqw;-webkit-mask:radial-gradient(circle,transparent 30%,#000 34%,#000 60%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 34%,#000 60%,transparent 70%);opacity:0;pointer-events:none}

/* ---------- C: cinematic backdrop ---------- */
[data-v=c] .stage{position:absolute;inset:0;z-index:0;grid-row:auto;grid-column:auto;align-self:stretch;padding:0;min-height:0;pointer-events:none}
.cv{position:absolute;left:0;right:0;top:var(--cv-top,140px);height:calc(100% + 40px);-webkit-mask:linear-gradient(transparent var(--cv-fade,120px),#000 calc(var(--cv-fade,120px) + 110px));mask:linear-gradient(transparent var(--cv-fade,120px),#000 calc(var(--cv-fade,120px) + 110px))}
.cv img,.cv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.cv video{opacity:0;transition:opacity .6s linear}
.cv video.on{opacity:1}
[data-v=c] .copy{text-shadow:0 1px 14px rgba(5,5,5,.9)}
@media (min-width:960px){
  .cv{left:auto;right:0;top:0;bottom:0;height:auto;width:52%;-webkit-mask:linear-gradient(90deg,transparent,#000 30%),linear-gradient(transparent,#000 12%,#000 82%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 30%) intersect,linear-gradient(transparent,#000 12%,#000 82%,transparent)}
  .cv img,.cv video{object-position:50% 30%}
}
/* ---------- A2: zoomed "Fill" demo with edge-follow camera ---------- */
[data-v=a2] .stage{padding-top:14px}
.devs.a2{--mac-l:11;--mac-w:78;--ph-l:0;--ph-w:100;--ph-t:45;--st:95.2;--h:102}
@media (min-width:960px){[data-v=a2] .stage{padding-top:0}.devs.a2{--mac-l:6;--mac-w:88;--ph-l:18;--ph-w:64;--ph-t:51;--st:84.5;--h:90}}
@media (max-width:520px) and (max-height:760px){
  [data-v=a2] .top{height:50px}
  [data-v=a2] h1{font-size:clamp(30px,9vw,40px)}
  [data-v=a2] .sub{font-size:15.5px;margin-top:8px}
  [data-v=a2] .join{margin-top:14px;height:52px}
  [data-v=a2] .note{min-height:0;margin-top:4px}
  [data-v=a2] .stage{padding-top:10px}
  .devs.a2{--h:94}
  .a2-status{display:none}
}
.a2 .mac{z-index:1}.a2 .phone{z-index:2}
.a2-field{position:absolute;left:-16px;top:-14px;width:calc(100% + 32px);height:calc(100% + 28px);pointer-events:none;-webkit-mask:radial-gradient(closest-side,#000 50%,transparent);mask:radial-gradient(closest-side,#000 50%,transparent)}
.a2-scene{position:absolute;left:0;top:0;width:800px;height:500px;overflow:hidden;transform-origin:0 0;background:linear-gradient(#2a2724,#161513);color:var(--bone);font:13px/1.3 var(--ui);-webkit-font-smoothing:antialiased}
.a2-cam{position:absolute;left:0;top:0;will-change:transform}
.a2-zoom{position:absolute;left:0;top:0;transform-origin:0 0}
.s-wall{position:absolute;inset:0;background:radial-gradient(circle,rgba(237,232,223,.36) 0 1.3px,transparent 1.8px) 0 0/9px 9px;-webkit-mask:radial-gradient(circle at 42% 118%,#000 0 24%,rgba(0,0,0,.35) 40%,transparent 60%);mask:radial-gradient(circle at 42% 118%,#000 0 24%,rgba(0,0,0,.35) 40%,transparent 60%)}
.s-menu{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:17px;padding:0 14px;background:rgba(12,12,12,.86);font-size:13px;color:rgba(237,232,223,.92);z-index:20}
.s-menu .app{font-weight:700;min-width:58px}
.s-menu .r{margin-left:auto;display:flex;align-items:center;gap:13px}
.s-menu svg{width:10px;height:15px}
.s-win{position:absolute;border-radius:10px;background:#171717;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 44px rgba(0,0,0,.62);overflow:hidden;z-index:2}
.s-win.on{z-index:8}

/* ---------------- B: real-UI loop ---------------- */
function initB() {
  const root = stage.querySelector('.devs');
  const macScr = root.querySelector('.mac-scr'), macScene = macScr.querySelector('.bscene');
  const phScr = root.querySelector('.ph-scr'), cam = phScr.querySelector('.ph-cam');
  const phScene = macScene.cloneNode(true); cam.append(phScene);
  const wins = [macScene, phScene].map(s => s.querySelector('.b-win'));
  const macPtr = macScr.querySelector('.ptr'), phPtr = phScr.querySelector('.ptr');
  const g1 = phScr.querySelector('.g1'), g2 = phScr.querySelector('.g2');
  const contact = phScr.querySelector('.contact'), halo = phScr.querySelector('.halo');
  const W0 = { x: .21033, y: .22009 }, W1 = { x: .075, y: .1 }, WW = .57934, WH = .55915;
  const W = { ...W0 }, P = { x: .56, y: .5 }, Z = { s: 1, ox: .5, oy: .5 };

  function place() {

    wins[1].style.transform = `translate3d(${(W.x - W0.x) * dw}px,${(W.y - W0.y) * dh}px,0)`;
    cam.style.transformOrigin = `${Z.ox * 100}% ${Z.oy * 100}%`;
    cam.style.transform = Z.s === 1 ? '' : `scale(${Z.s})`;
    macPtr.style.transform = `translate3d(${P.x * mw}px,${P.y * mh}px,0)`;
    const q = phPos(P);
    phPtr.style.transform = `translate3d(${q.x}px,${q.y}px,0)`;
    contact.style.transform = halo.style.transform = `translate3d(${q.x}px,${q.y}px,0)`;
  }
  const gAt = (i, x, y) => { G[i].x = x; G[i].y = y; G[i].el.style.transform = `translate3d(${x}px,${y}px,0)`; };
  function measure() {
    const a = macScr.getBoundingClientRect(), b = phScr.getBoundingClientRect(), c = cam.getBoundingClientRect();
    const s = Z.s || 1;

    if (!await press(tok, true)) return false;

      if (!await opa(g1, 0, 260, k)) return;

}

    if (quick && e.type === 'pointerup') { const r = phScr.getBoundingClientRect(); click(true, e.clientX - r.left, e.clientY - r.top); }
    scheduleIdle();
  };
  phScr.addEventListener('pointerup', up);
  phScr.addEventListener('pointercancel', up);
  phScr.addEventListener('keydown', e => {
    const k = e.key, st = e.shiftKey ? 80 : 24;
    const m = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[k];
    if (m) { stopDemo(); touched = true; hideTry(); P.x = clamp(P.x + m[0], 0, DW - 2); P.y = clamp(P.y + m[1], 0, DH - 2); place(); kick(); scheduleIdle(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { stopDemo(); touched = true; hideTry(); click(true, (P.x - C.x) * s, (P.y - C.y) * s); scheduleIdle(); e.preventDefault(); }
  });

  function measure() {
    const a = macScr.getBoundingClientRect(), b = phScr.getBoundingClientRect();
    dpr = devicePixelRatio || 1; ms = a.width / DW; pw = b.width; ph = b.height; s = ph / VIEW_H; vw = pw / s; vh = ph / s;
    macScene.style.transform = `scale(${ms})`;
    zoomEl.style.transform = `scale(${s})`;
    viewEl.style.width = vw * ms + 'px';
    const t = camTarget(); C.x = t.x; C.y = t.y;
    place(); sizeField();
  }
  new ResizeObserver(measure).observe(root);
  measure();

  if (RM) {
    S.focus = 'chat'; S.typing = true; S.text = 'on it, 5 min'; render();
    K = 1; kb.style.transform = 'none';
    const c = ctr('.ch-in', .56, .5); P.x = c.x; P.y = c.y;
    C.x = clamp(P.x - vw * .45, 0, DW - vw); C.y = clamp(P.y - vhE() + vhE() * MY, 0, DH - vhE()); place();
    tryEl = document.createElement('div'); tryEl.className = 'try'; tryEl.textContent = 'Tap to try'; phScr.append(tryEl);
    return;
  }
  render();
  const start = ctr('.ch-body .in', .45, .55); P.x = start.x; P.y = start.y;
  C.x = clamp(P.x - vw * .4, 0, DW - vw); C.y = clamp(P.y - vh * .5, 0, DH - vh); place();
  setTimeout(demo, 250);
}

/* ---------------- C: cinematic backdrop ---------------- */
function initC() {
  const cv = stage.querySelector('.cv'), v = cv.querySelector('video');
  const copy = document.querySelector('.copy');
  function fit() {
    if (innerWidth >= 960) { cv.style.removeProperty('--cv-top'); cv.style.removeProperty('--cv-fade'); return; }
    const w = cv.clientWidth, h = cv.clientHeight, rh = Math.max(h, w * 16 / 9);
    const hero = document.querySelector('.hero').getBoundingClientRect(), cb = copy.getBoundingClientRect().bottom - hero.top;
    const top = Math.round(cb + 128 - .36 * rh);
    cv.style.setProperty('--cv-top', top + 'px');
    cv.style.setProperty('--cv-fade', Math.max(0, Math.round(cb - top + 6)) + 'px');
  }
  new ResizeObserver(fit).observe(document.querySelector('.hero')); fit();
  if (RM) return;
  v.addEventListener('playing', () => v.classList.add('on'), { once: true });
  const play = () => { if (!v.src) return; const p = v.play(); if (p) p.catch(() => {}); };
  onVis = vis => vis && !document.hidden ? play() : v.pause();
  v.autoplay = true;
  // Pages answers Range requests with a full 200, which iOS Safari rejects for <video>; a blob URL sidesteps it.
  fetch('c/reach.mp4').then(r => r.blob()).then(b => { v.src = URL.createObjectURL(b); play(); }).catch(() => {});
}

const frag = document.getElementById('tpl-' + V).content.cloneNode(true);
if (V === 'c' && RM) { frag.querySelector('video').remove(); frag.querySelector('source[type="image/avif"]').srcset = 'c/still.avif'; frag.querySelector('img').src = 'c/still.webp'; }
stage.append(frag);
({ a: initA, a2: initA2, b: initB, c: initC })[V]();

/* ---------------- weight readout ---------------- */
const btn = document.querySelector('.lab-w'), panel = document.getElementById('labd');
const fmt = n => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
const entries = [];
function nameOf(u) { try { const x = new URL(u); return x.origin === location.origin ? x.pathname.replace(/^\//, '') || 'index.html' : x.host + x.pathname; } catch (e) { return u; } }
function update() {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [];
  if (nav) rows.push(['index.html (HTML+CSS+JS)', nav.encodedBodySize || nav.transferSize || 0, false]);
  for (const e of entries) { const sz = e.encodedBodySize || e.transferSize || 0; rows.push([nameOf(e.name), sz, !sz]); }
  const total = rows.reduce((s, r) => s + r[1], 0), cross = rows.filter(r => r[2]).length;
  btn.className = 'lab-w ' + (total <= BUDGET[V] ? 'ok' : 'over');
  btn.querySelector('span').textContent = `${fmt(total)} / ${fmt(BUDGET[V]).replace('.00', '')}`;
  const b = BUILD && BUILD[V];
  panel.innerHTML = `<p><b>Version ${V.toUpperCase()}</b> · measured this page load with PerformanceResourceTiming (compressed body bytes). Budget ${fmt(BUDGET[V])}.${V === 'b' ? ' B animates real Farside screenshots (sample desktop) as a stand-in for filmed footage.' : ''}</p>` +
    `<h4>Measured: ${fmt(total)} · ${rows.length} requests${cross ? ` · ${cross} cross-origin not measurable` : ''}</h4><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[2] ? 'n/a' : fmt(r[1])}</td></tr>`).join('')}</table>` +
    (b ? `<h4>Build estimate: ${fmt(b.total)}</h4><table>${b.files.map(f => `<tr><td>${f[0]}</td><td>${fmt(f[1])}</td></tr>`).join('')}</table>` : '');
}
try { new PerformanceObserver(l => { entries.push(...l.getEntries()); update(); }).observe({ type: 'resource', buffered: true }); } catch (e) {}
addEventListener('load', () => setTimeout(update, 50));
update();
btn.addEventListener('click', () => { const o = panel.hidden; panel.hidden = !o; btn.setAttribute('aria-expanded', String(o)); if (o) update(); });
})();
</script>
