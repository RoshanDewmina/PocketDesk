name: PocketDesktop
options:
  bundleIdPrefix: com.roshan
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  PocketDesktop:
    type: application
    platform: iOS
    sources: [PocketDesktop, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesktop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Desktop
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the Mac you pair with to view and control its shared screen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false
      testTargets:
        - PocketDesktopTests
        - PocketDesktopUITests
  PocketDesktopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketDesktopTests]
    dependencies:
      - target: PocketDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PocketDesktopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PocketDesktopUITests]
    dependencies:
      - target: PocketDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PocketDesktopHost:
    type: application
    platform: macOS
    deploymentTarget: '15.2'
    sources: [PocketDesktopHost, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesktopHost
        PRODUCT_NAME: PocketDesktopHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Desktop Host
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Share a selected screen with your paired Pocket Desktop device.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Stream the content you choose to your paired device.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}

  StreamTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.2'
    sources: [StreamTests, Shared, PocketDesktopHost/HostStream.swift]
    settings:
      base:
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: [StreamTests]
  PocketDeskRemote:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemotePhone, RemoteShared, PocketDesktop/TrackpadSurface.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.Remote
        CURRENT_PROJECT_VERSION: 20260928.11
        MARKETING_VERSION: '0.1'
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketDesk
        INFOPLIST_FILE: RemotePhone/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Discover and connect securely to your paired Mac.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown on your Mac.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use your microphone to dictate text for your Mac.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into text for the active field on your Mac.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets: [RemotePhoneTests, RemotePhoneUITests]
  RemotePhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemotePhoneTests]
    dependencies:
      - target: PocketDeskRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RemotePhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemotePhoneUITests]
    dependencies:
      - target: PocketDeskRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PocketDeskRemoteHost:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - RemoteHost
      - RemoteShared
      - path: RemoteWatchdog/LaunchAgent/com.roshan.PocketDesk.RemoteHost.watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: WebRTC
      - target: FarsideWatchdog
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.RemoteHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farside
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Share a selected display with your paired phone.
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
  FarsideWatchdog:
    type: tool
    platform: macOS
    deploymentTarget: '26.0'
    sources: [RemoteWatchdog/main.swift, RemoteWatchdog/WatchdogSupervisor.swift, RemoteHost/HostWatchdogState.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.RemoteHost.watchdog
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  RemoteCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources: [RemoteTests, RemoteShared, RemoteHost/HostPresentation.swift, RemoteHost/HostTextFocusProbe.swift, RemoteHost/RemoteCapture.swift, RemoteHost/RemoteInputDriver.swift, RemoteHost/HostCursorShape.swift, RemoteHost/HostClipboard.swift, RemoteHost/HostPairingPreflight.swift, RemoteHost/HostPermissionState.swift, RemoteHost/HostReadiness.swift, RemoteHost/HostKeepAwake.swift, RemoteHost/HostTermination.swift, RemoteHost/BrowserPeerController.swift, RemoteHost/BrowserPeerStore.swift, RemoteHost/BrowserFrameMarker.swift, RemoteHost/BrowserInputGate.swift, RemoteHost/HostWatchdogState.swift, RemoteHost/HostHangWatchdog.swift, RemoteHost/HostWatchdogReporter.swift, RemoteHost/HostLoginItem.swift, RemoteHost/HostViewState.swift, RemoteHost/PrivacyCurtain.swift, RemoteHost/HostDiagnostics.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme:
      testTargets: [RemoteCoreTests]
  HostUISnapshotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - HostUITests
      - RemoteShared/Pairing.swift
      - RemoteShared/FarsideTheme.swift
      - RemoteHost/HostReadiness.swift
      - RemoteHost/HostViewState.swift
      - RemoteHost/HostPresentation.swift
      - RemoteHost/HostPermissionState.swift
      - RemoteHost/HostStyle.swift
      - RemoteHost/HostMark.swift
      - RemoteHost/HostHalftoneArt.swift
      - RemoteHost/HostSettingsSection.swift
      - RemoteHost/HostPopoverView.swift
      - RemoteHost/HostSetupView.swift
      - RemoteHost/HostSettingsView.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme:
      testTargets: [HostUISnapshotTests]
  PocketDeskBrowserFixture:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources: [BrowserFixtureHost, RemoteShared, RemoteHost/BrowserPeerController.swift, RemoteHost/BrowserPeerStore.swift, RemoteHost/BrowserFrameMarker.swift, RemoteHost/BrowserInputGate.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.BrowserFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketDesk Synthetic Browser Test
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme: {}
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
