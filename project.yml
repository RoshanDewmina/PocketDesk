name: PocketDesktop
options:
  bundleIdPrefix: com.roshan
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  PocketDesktop:
    type: application
    platform: iOS
    sources: [PocketDesktop, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesktop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Desktop
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the Mac you pair with to view and control its shared screen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false
      testTargets:
        - PocketDesktopTests
        - PocketDesktopUITests
  PocketDesktopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketDesktopTests]
    dependencies:
      - target: PocketDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PocketDesktopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PocketDesktopUITests]
    dependencies:
      - target: PocketDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PocketDesktopHost:
    type: application
    platform: macOS
    deploymentTarget: '15.2'
    sources: [PocketDesktopHost, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesktopHost
        PRODUCT_NAME: PocketDesktopHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Desktop Host
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Share a selected screen with your paired Pocket Desktop device.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Stream the content you choose to your paired device.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}

  StreamTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.2'
    sources: [StreamTests, Shared, PocketDesktopHost/HostStream.swift]
    settings:
      base:
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: [StreamTests]
  PocketDeskRemote:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemotePhone, RemoteShared, PocketDesktop/TrackpadSurface.swift]
    dependencies:
      - package: WebRTC
      - target: FarsideWidgets
      - target: FarsideShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.Remote
        CURRENT_PROJECT_VERSION: '20260930.7'
        MARKETING_VERSION: '1.0'
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farside
        INFOPLIST_FILE: RemotePhone/Info.plist
        # Push, Time Sensitive and Associated Domains need an explicit App ID, which the wildcard
        # development profile cannot provide. Off by default so a device build signs; on with
        # FARSIDE_ENABLE_PUSH=YES once the App ID exists (design/SYSTEM-INTEGRATIONS-REPORT.md).
        CODE_SIGN_ENTITLEMENTS: $(FARSIDE_ENTITLEMENTS_$(FARSIDE_ENABLE_PUSH))
        FARSIDE_ENABLE_PUSH: 'NO'
        FARSIDE_APNS_ENVIRONMENT: development
        # The App Group (Connect widget snapshot) is in both; only push and domains wait for the flag.
        FARSIDE_ENTITLEMENTS_NO: RemotePhone/FarsideAppGroup.entitlements
        FARSIDE_ENTITLEMENTS_YES: RemotePhone/Farside.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect directly to your paired Mac when it's on the same Wi-Fi.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown on your Mac.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use your microphone to dictate text for your Mac.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into text on this iPhone for the active field on your Mac.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Confirm it’s you before connecting to or forgetting your Mac, when you turn that on in Settings.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Farside Anywhere (Docs/launch/STOREKIT-IMPLEMENTATION.md). Release builds send a signed
        # transaction only to FARSIDE_SERVICE_BASE_URL (https); empty keeps Anywhere unverifiable.
        FARSIDE_SERVICE_BASE_URL: ''
        FARSIDE_SERVICE_READY: 'NO'
        FARSIDE_TERMS_URL: https://getfarside.com/terms
        FARSIDE_PRIVACY_URL: https://getfarside.com/privacy
      configs:
        Release:
          FARSIDE_SERVICE_BASE_URL: https://signal.getfarside.com
          FARSIDE_ENABLE_PUSH: 'YES'
          FARSIDE_APNS_ENVIRONMENT: production
    scheme:
      testTargets: [RemotePhoneTests, RemotePhoneUITests]
      storeKitConfiguration: StoreKitTesting/FarsideAnywhere.storekit
  FarsideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - FarsideWidgets
      - RemotePhone/ActivityShared
      - RemoteShared/FarsideTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.Remote.Widgets
        CURRENT_PROJECT_VERSION: '20260930.7'
        MARKETING_VERSION: '1.0'
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FarsideWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Farside
        CODE_SIGN_ENTITLEMENTS: FarsideWidgets/FarsideWidgets.entitlements
        SKIP_INSTALL: YES
  # Send to My Mac: stages one shared item in the App Group for the app's live session to send.
  FarsideShare:
    type: app-extension
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - FarsideShare
      - RemotePhone/ShareShared
      - RemoteShared/FarsideTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.Remote.Share
        CURRENT_PROJECT_VERSION: '20260930.7'
        MARKETING_VERSION: '1.0'
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FarsideShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Send to My Mac
        CODE_SIGN_ENTITLEMENTS: FarsideShare/FarsideShare.entitlements
        SKIP_INSTALL: YES
  RemotePhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - RemotePhoneTests
      - path: StoreKitTesting/FarsideAnywhere.storekit
        buildPhase: resources
    dependencies:
      - target: PocketDeskRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RemotePhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemotePhoneUITests]
    dependencies:
      - target: PocketDeskRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PocketDeskRemoteHost:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - RemoteHost
      - RemoteShared
      # Doto and Instrument Serif Italic with their OFL texts: the phone's files, one copy for both apps.
      - RemotePhone/Fonts
      - path: RemoteWatchdog/LaunchAgent/com.roshan.PocketDesk.RemoteHost.watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: script/agent-hooks/farside-notify
        buildPhase:
          copyFiles:
            destination: resources
            subpath: agent-hooks
    dependencies:
      - package: WebRTC
      - package: Sparkle
      - target: FarsideWatchdog
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: RemoteShared/SystemAudio-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.RemoteHost
        # D35: Apple silicon only (M1 or later), in every configuration.
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farside
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: '20260930.7'
        MARKETING_VERSION: '1.0'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect directly to your paired iPhone or iPad on your local network.
        INFOPLIST_FILE: RemoteHost/Info.plist
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Share a selected display with your paired phone.
        FARSIDE_UPDATE_PUBLIC_KEY: ''
        INFOPLIST_KEY_SUPublicEDKey: $(FARSIDE_UPDATE_PUBLIC_KEY)
        INFOPLIST_KEY_SUFeedURL: https://getfarside.com/mac/appcast.xml
        INFOPLIST_KEY_SUEnableAutomaticChecks: NO
        INFOPLIST_KEY_SUAutomaticallyUpdate: NO
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          INFOPLIST_KEY_PocketDeskServiceURL: wss://signal.getfarside.com/signal
    scheme: {}
  FarsideWatchdog:
    type: tool
    platform: macOS
    deploymentTarget: '26.0'
    sources: [RemoteWatchdog/main.swift, RemoteWatchdog/WatchdogSupervisor.swift, RemoteWatchdog/WatchdogE2E.swift, RemoteHost/HostWatchdogState.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.RemoteHost.watchdog
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 39HM2X8GS6
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  RemoteCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources: [RemoteTests, RemoteShared, RemoteHost/HostPresentation.swift, RemoteHost/HostTextFocusProbe.swift, RemoteHost/HostAXBroker.swift, RemoteHost/RemoteCapture.swift, RemoteHost/ViewportCapture.swift, RemoteHost/RemoteInputDriver.swift, RemoteHost/RemoteInputEvents.swift, RemoteHost/HostSecureFocus.swift, RemoteHost/HostCursorShape.swift, RemoteHost/HostClipboard.swift, RemoteHost/HostPairingPreflight.swift, RemoteHost/HostPermissionState.swift, RemoteHost/HostReadiness.swift, RemoteHost/Availability/HostLANWake.swift, RemoteHost/Availability/LANMagicPacketSender.swift, RemoteHost/HostInputExecutor.swift, RemoteHost/HostCaptureScope.swift, RemoteHost/HostKeepAwake.swift, RemoteHost/HostTermination.swift, RemoteHost/BrowserPeerController.swift, RemoteHost/BrowserPeerStore.swift, RemoteHost/BrowserFrameMarker.swift, RemoteHost/BrowserInputGate.swift, RemoteHost/HostWatchdogState.swift, RemoteHost/HostHangWatchdog.swift, RemoteHost/HostWatchdogReporter.swift, RemoteHost/HostLoginItem.swift, RemoteHost/HostViewState.swift, RemoteHost/PrivacyCurtain.swift, RemoteHost/HostDiagnostics.swift, RemoteHost/HostE2EInputFence.swift, RemoteWatchdog/WatchdogE2E.swift, RemoteHost/HostDisplayCatalog.swift, RemoteHost/AgentAlertGate.swift, RemoteHost/AgentBridgeHTTP.swift, RemoteHost/AgentAlertBridge.swift, RemoteHost/HostAgentAlerts.swift,
              RemoteHost/HostLoadMonitor.swift, FarsideTestPad/BenchState.swift, RemoteHost/HostFileTransfer.swift,
              RemoteHost/HostAppActivation.swift, RemoteHost/HostActivity.swift, RemoteHost/MacVitalsSources.swift, RemoteHost/MacVitalsMonitor.swift, RemoteHost/CouchSessionPolicy.swift, RemoteHost/BigTextModes.swift, RemoteHost/BigTextDisplaySwitcher.swift, RemoteHost/BigTextWindows.swift, RemoteHost/BigTextController.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: RemoteShared/SystemAudio-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUDIO_LIFETIME_TESTS"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme:
      testTargets: [RemoteCoreTests]
  HostUISnapshotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - HostUITests
      - RemotePhone/Fonts
      - RemoteShared/Pairing.swift
      - RemoteShared/HostIdentityStore.swift
      - RemoteShared/FarsideTheme.swift
      - RemoteShared/FarsideHalftone.swift
      - RemoteHost/HostReadiness.swift
      - RemoteHost/HostViewState.swift
      - RemoteHost/HostPresentation.swift
      - RemoteHost/HostPermissionState.swift
      - RemoteHost/HostStyle.swift
      - RemoteHost/HostMark.swift
      - RemoteHost/HostArt.swift
      - RemoteHost/HostSettingsSection.swift
      - RemoteHost/HostPopoverView.swift
      - RemoteHost/HostLiveStrip.swift
      - RemoteHost/HostActivity.swift
      - RemoteHost/HostMenuBarGlyph.swift
      - RemoteShared/ConnectMotionModel.swift
      - RemoteHost/HostSetupView.swift
      - RemoteHost/HostSettingsView.swift
      - RemoteShared/WakeRequest.swift
      - RemoteHost/Availability/HostLANWake.swift
      - RemoteHost/Availability/LANMagicPacketSender.swift
      - RemoteHost/Availability/WakeTargetRegistrationView.swift
      - RemoteShared/SessionDiagnosticReport.swift
      - RemoteShared/LegalNoticesView.swift
      - RemoteShared/ThirdPartyNotices.txt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme:
      testTargets: [HostUISnapshotTests]
  PocketDeskBrowserFixture:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources: [BrowserFixtureHost, RemoteShared, RemoteHost/BrowserPeerController.swift, RemoteHost/BrowserPeerStore.swift, RemoteHost/BrowserFrameMarker.swift, RemoteHost/BrowserInputGate.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: RemoteShared/SystemAudio-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.BrowserFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketDesk Synthetic Browser Test
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme: {}
  # E2E harness (script/e2e/README.md): the only window the harness may click or type into.
  FarsideTestPad:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources: [FarsideTestPad, RemoteShared/E2EWindowCover.swift, RemoteShared/MachClock.swift, RemoteShared/BenchMarker.swift,
              RemoteShared/LegibilityChart.swift, RemoteShared/BenchRenderers.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.FarsideTestPad
        PRODUCT_NAME: Farside Test Pad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farside Test Pad
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme: {}
  # E2E harness self-test host: synthetic frames, virtual pointer, no capture or injection.
  FarsideE2EStubHost:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources: [E2EStubHost, RemoteShared]
    dependencies:
      - package: WebRTC
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: RemoteShared/SystemAudio-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.PocketDesk.E2EStubHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farside E2E Stub Host
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: '-'
    scheme: {}
  RemoteE2ETests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources: [RemoteE2ETests]
    dependencies:
      - target: PocketDeskRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: RemoteE2ETests/RemoteE2ETests-Bridging-Header.h
schemes:
  FarsideE2E:
    build:
      targets:
        PocketDeskRemote: all
        RemoteE2ETests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RemoteE2ETests
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
