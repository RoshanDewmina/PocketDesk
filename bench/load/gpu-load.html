<!doctype html>
<meta charset="utf-8">
<title>Farside GPU load</title>
<style>html,body{margin:0;height:100%;background:#000;color:#9f9;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#hud{position:fixed;left:8px;top:8px}</style>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Steady GPU load for the realistic-load benchmark (Docs/perf/EFFICIENCY-AUDIT-2026-09-30.md §5).
// ?iters=N sets the fragment-shader loop count (default 64, heavier with more); ?scale=0.5 renders
// at half the window's pixels. Runs at the display's rate through requestAnimationFrame.
const params = new URLSearchParams(location.search);
const iters = Math.max(1, Math.min(4096, parseInt(params.get('iters') || '64', 10)));
const scale = Math.max(0.1, Math.min(2, parseFloat(params.get('scale') || '1')));
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
const hud = document.getElementById('hud');
if (!gl) { hud.textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const fs = `#version 300 es
precision highp float; uniform float t; uniform vec2 r; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / r; vec3 c = vec3(0.0); float a = t;
  for (int i = 0; i < ${iters}; i++) {
    a += sin(uv.x * 7.0 + float(i) * 0.37) * cos(uv.y * 5.0 - a * 0.11);
    c += 0.5 + 0.5 * cos(a + vec3(0.0, 2.0, 4.0) + uv.xyx * 3.0);
  }
  o = vec4(c / float(${iters}), 1.0);
}`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, 't'), uR = gl.getUniformLocation(prog, 'r');
let frames = 0, last = performance.now();
function frame(now) {
  const w = Math.round(innerWidth * devicePixelRatio * scale), h = Math.round(innerHeight * devicePixelRatio * scale);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  gl.uniform1f(uT, now / 1000); gl.uniform2f(uR, w, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  if (now - last >= 1000) { hud.textContent = `${frames} fps · iters ${iters} · ${w}×${h}`; frames = 0; last = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
